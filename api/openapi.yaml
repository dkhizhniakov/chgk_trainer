openapi: 3.1.0
info:
  title: ChGK Trainer API
  version: 0.1.0
  description: API для веб-приложения тренировки к Что? Где? Когда?

servers:
  - url: /api
    description: Current host

paths:
  /health:
    get:
      summary: Liveness health check
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /v1/me:
    get:
      summary: Get current authenticated user profile and roles
      operationId: getMe
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito Access Token

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Forbidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time

    UserSettings:
      type: object
      required:
        - defaultTimerSec
        - autoAddMissedToReview
      properties:
        defaultTimerSec:
          type: integer
          default: 60
        autoAddMissedToReview:
          type: boolean
          default: true

    MeResponse:
      type: object
      required:
        - sub
        - email
        - roles
        - settings
        - createdAt
      properties:
        sub:
          type: string
          example: 01JABCDEF1234567890
        email:
          type: string
          format: email
          example: player@example.com
        roles:
          type: array
          items:
            type: string
          example: ["admin", "editor"]
        settings:
          $ref: '#/components/schemas/UserSettings'
        createdAt:
          type: string
          format: date-time

    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          example: https://chgk-trainer/errors/internal
        title:
          type: string
          example: Internal Server Error
        status:
          type: integer
          example: 500
        detail:
          type: string
          example: An unexpected error occurred.
        instance:
          type: string
          example: /api/v1/me
        requestId:
          type: string
          example: 01J123456789ABC
        errors:
          type: array
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
              message:
                type: string
